name: GitHub Release

# Creates a GitHub release with the plugin archive attached when a v2+ tag is pushed (v1.x tags are ignored).
# Release notes are auto-generated from commits and can be edited afterwards.

on:
  push:
    tags:
      - 'v[2-9].*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd addons
          zip -r "../playgama_bridge_${TAG}.zip" playgama_bridge \
            -x '*.DS_Store' -x '*/.idea/*'
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="playgama_bridge_${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes --verify-tag
          fi
